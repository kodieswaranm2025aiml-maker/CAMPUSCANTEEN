<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>My Orders</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="wrap"><h1>My Orders</h1><div class="card" th:each="o : ${orders}"><h3>Token #<span th:text="${o.id}"></span> — ₹<span th:text="${o.total}"></span></h3><p>Status: <b th:text="${o.status}"></b></p><p th:text="${o.orderTime}"></p><ul><li th:each="i : ${o.items}"><span th:text="${i.menuItem.name}"></span> × <span th:text="${i.quantity}"></span> = ₹<span th:text="${i.lineTotal}"></span></li></ul></div><p th:if="${#lists.isEmpty(orders)}">You have not placed any orders yet.</p></main></body></html>
