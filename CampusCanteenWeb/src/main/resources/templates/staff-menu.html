<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Manage Menu</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="wrap"><h1>Manage Menu</h1><form class="card formrow" th:action="@{/staff/menu/add}" method="post"><input name="name" placeholder="Food name" required><input name="category" placeholder="Category" required><input name="price" type="number" min="1" step=".01" placeholder="Price" required><button>Add item</button></form><div class="card" th:each="item : ${items}"><b th:text="${item.name}"></b> — ₹<span th:text="${item.price}"></span> (<span th:text="${item.available ? 'Available' : 'Unavailable'}"></span>)<form class="inline" th:action="@{'/staff/menu/' + ${item.id} + '/availability'}" method="post"><button>Toggle availability</button></form></div></main></body></html>
