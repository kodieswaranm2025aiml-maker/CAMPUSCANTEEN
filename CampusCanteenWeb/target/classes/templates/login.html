<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Login - Campus Canteen</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth card"><h1>Campus Canteen</h1><p>Sign in to order food or manage the canteen.</p><p class="success" th:if="${param.registered}">Registration successful. Please log in.</p><p class="error" th:if="${param.error}">Invalid username or password.</p><form th:action="@{/login}" method="post"><label>Username</label><input name="username" required><label>Password</label><input name="password" type="password" required><button>Login</button></form><p>New student? <a href="/register">Create an account</a></p><small>Staff demo: staff / staff123</small></main></body></html>
