<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Manage Orders</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="wrap"><h1>Order Queue</h1><div class="card" th:each="o : ${orders}"><h3>Token #<span th:text="${o.id}"></span> — <span th:text="${o.student.name}"></span></h3><p>Total: ₹<span th:text="${o.total}"></span> | <b th:text="${o.status}"></b></p><ul><li th:each="i : ${o.items}"><span th:text="${i.menuItem.name}"></span> × <span th:text="${i.quantity}"></span></li></ul><form th:action="@{'/staff/orders/' + ${o.id} + '/status'}" method="post"><select name="status"><option>PREPARING</option><option>READY</option><option>COMPLETED</option><option>CANCELLED</option></select><button>Update status</button></form></div><p th:if="${#lists.isEmpty(orders)}">No orders yet.</p></main></body></html>
