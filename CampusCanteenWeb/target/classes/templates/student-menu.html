<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Food Menu</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="wrap"><h1>Today's Menu</h1><p class="error" th:text="${error}"></p><form th:action="@{/student/order}" method="post"><div class="grid"><div class="card food" th:each="item : ${items}"><h3 th:text="${item.name}"></h3><p th:text="${item.category}"></p><strong>₹<span th:text="${item.price}"></span></strong><label>Quantity</label><input type="hidden" name="itemIds" th:value="${item.id}"><input type="number" name="quantities" min="0" max="20" value="0"></div></div><button>Place Order</button></form></main></body></html>
